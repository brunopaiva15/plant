# Icône de l'application : le pot d'argile et sa pousse, rendus en 3D, sur
# fond sauge. Les sources listées ici sont composées à partir des rendus de
# assets/icon/rendu/ par tool/build_app_icon.py, qui écrit aussi les
# déclinaisons de chaque plateforme. Régénérer après modification :
#   python3 tool/build_app_icon.py
# ou, si la chaîne Flutter est installée :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "ic_launcher"
  # Deux calques pleins : le dégradé sauge, et le pot rendu avec un champ
  # élargi d'un tiers, si bien que la zone visible reprend le cadrage de
  # l'icône et que le pot continue sous le masque du lanceur.
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

  ios: true
  # iOS refuse toute transparence dans l'icône de l'App Store.
  remove_alpha_ios: true
  # Pas l'avant-plan d'Android : son champ est élargi d'un tiers, et iOS ne
  # rogne rien. Le mode nuit et le mode teinté prennent donc le pot au même
  # cadrage que l'icône claire, fond en moins.
  image_path_ios_dark_transparent: "assets/icon/icon_ios_foreground.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon_ios_foreground.png"
  # Le mode teinté d'iOS 18 attend une image en niveaux de gris.
  desaturate_tinted_to_grayscale_ios: true

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#F6EFE4"
    theme_color: "#2F7F53"
