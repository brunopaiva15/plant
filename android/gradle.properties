org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# `tflite_flutter` compile son Java en cible 11 sans rien dire de Kotlin, que
# Gradle cible alors sur le JDK installé : sans cette ligne, la vérification
# de cohérence arrête la construction (« Inconsistent JVM Target
# Compatibility »). Le plugin n'a pas une ligne de Kotlin, l'écart n'a donc
# rien à produire : il est signalé, pas bloquant.
kotlin.jvm.target.validation.mode=warning
