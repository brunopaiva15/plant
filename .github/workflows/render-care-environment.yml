name: Render care environment assets

on:
  push:
    branches:
      - feature/care-environment-scenes

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/care-environment-scenes
          fetch-depth: 1

      - name: Fix Blender compatibility and harden validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          blender = Path('tool/build_care_scene.py')
          text = blender.read_text()
          old = '    sc.view_settings.look = "Medium High Contrast"\n'
          new = '''    # Blender 4.x préfixe les looks AgX, les versions plus anciennes non.\n    for look in ("AgX - Medium High Contrast", "Medium High Contrast"):\n        try:\n            sc.view_settings.look = look\n            break\n        except TypeError:\n            pass\n'''
          if old not in text and new not in text:
              raise SystemExit('look AgX introuvable')
          blender.write_text(text.replace(old, new, 1))

          orchestrator = Path('tool/build_care_scene_assets.py')
          text = orchestrator.read_text()
          old = '''    if missing:\n        print("Manquants:")\n        for p in missing:\n            print("  -", p.relative_to(ROOT))\n    total = sum(p.stat().st_size for p in files if p.exists())\n'''
          new = '''    if missing:\n        print("Manquants:")\n        for p in missing:\n            print("  -", p.relative_to(ROOT))\n        raise SystemExit(f"{len(missing)} asset(s) care_scene manquant(s).")\n    total = sum(p.stat().st_size for p in files)\n'''
          if old not in text and new not in text:
              raise SystemExit('validation assets introuvable')
          orchestrator.write_text(text.replace(old, new, 1))
          PY

      - name: Install Blender and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python3 -m pip install --user Pillow

      - name: Render delivery assets
        run: python3 tool/build_care_scene_assets.py

      - name: Build visual contact sheet
        run: python3 -c "from tool.build_care_scene_assets import contact_sheet, RAW; contact_sheet(RAW)"

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: care-environment-contact-sheet
          path: /tmp/care_scene/contact_sheet.png
          if-no-files-found: error

      - name: Validate output
        run: |
          python3 -m py_compile tool/build_care_scene.py tool/build_care_scene_assets.py
          python3 tool/build_care_scene_assets.py --poids
          test "$(find assets/care_scene -type f -name '*.webp' | wc -l)" -eq 21
          git diff --check

      - name: Commit generated assets and fixes
        run: |
          rm .github/workflows/render-care-environment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add rendered care environment assets [skip ci]"
          git push origin HEAD:feature/care-environment-scenes
