name: Bootstrap care environment scenes

on:
  push:
    branches:
      - feature/care-environment-scenes

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/care-environment-scenes
          fetch-depth: 1

      - name: Integrate feature
        run: python3 tool/bootstrap_care_environment.py

      - name: Install Blender and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python3 -m pip install --user Pillow

      - name: Generate care scene assets
        run: python3 tool/build_care_scene_assets.py

      - name: Validate generators and diff
        run: |
          python3 -m py_compile tool/build_care_scene.py tool/build_care_scene_assets.py
          python3 tool/build_care_scene_assets.py --poids
          git diff --check

      - name: Commit generated feature
        run: |
          rm tool/bootstrap_care_environment.py
          rm .github/workflows/bootstrap-care-environment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate isometric care environment scenes [skip ci]"
          git push origin HEAD:feature/care-environment-scenes
