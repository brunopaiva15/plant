name: Capture care sheet

on:
  workflow_dispatch:
  push:
    branches:
      - improve-care-sheet-paper
    paths:
      - '.github/workflows/capture-care-sheet.yml'

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Capture real care sheet in iOS Simulator
        env:
          STORE_SCENES: care
          LANGS: fr
          FORMAT: iphone
        run: |
          chmod +x store/capture_ios.sh
          store/capture_ios.sh

      - name: Upload raw care screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-sheet-real-ios
          path: |
            store/shots-fr/care.png
            store/shots-fr/care-echec.png
          if-no-files-found: warn
          retention-days: 1
